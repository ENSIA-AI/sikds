# GitHub Actions

name: linter

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Strict check: run `vendor/bin/pint` locally to fix. Non-blocking until the codebase is fully formatted.
      - name: Run Pint (style check)
        continue-on-error: true
        run: vendor/bin/pint --test

      # Translation sync check: any new __('key') call must be added to lang/{en,fr,ar}.json.
      # Run `php artisan i18n:scan` locally to update the JSON files, then commit them.
      - name: Prepare environment for artisan
        run: |
          cp .env.example .env || true
          php artisan key:generate --ansi || true

      - name: Check translation key sync (i18n:scan --check)
        continue-on-error: true
        run: php artisan i18n:scan --check

      # Hardcoded-string lint: warns on raw text in blade. Non-blocking while the
      # migration is in progress; flip `continue-on-error` to false once done and
      # add `--strict` to fail the build.
      - name: Lint translations and blade text (i18n:lint)
        continue-on-error: true
        run: php artisan i18n:lint
